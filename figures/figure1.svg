<svg width="504" height="398" preserveAspectRatio="xMinYMin meet" viewBox="0 0 504 398" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink">
	<title>...</title>
	<desc>...</desc>
	<clipPath id="clip">
		<rect x="0" y="0" width="504" height="398"/>
	</clipPath>
	<g id="group" transform="scale(1,-1) translate(0,-398)" style="clip-path: url(#clip)">
		<g transform="">
			<text x="0" y="386" style="font-family: SansBold; font-size: 11px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,772) scale(1,-1)">WHAT TO CHANGE AND WHAT TO MEASURE</text>
			<rect x="0" y="302" width="248" height="70" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(91%,93%,94%); fill-rule: evenodd;"/>
			<text x="10" y="355" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,710) scale(1,-1)">Experimentally varied</text>
			<text x="10" y="340" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,680) scale(1,-1)">Identifier; identity aid; factual evidence; prompt;</text>
			<text x="10" y="329" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,658) scale(1,-1)">tools; declared resources</text>
			<rect x="256" y="302" width="248" height="70" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(91%,93%,94%); fill-rule: evenodd;"/>
			<text x="266" y="355" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,710) scale(1,-1)">Measured or unknown factors</text>
			<text x="266" y="340" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,680) scale(1,-1)">Chemical family; literature coverage; similarity;</text>
			<text x="266" y="329" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,658) scale(1,-1)">expertise; training exposure</text>
			<text x="0" y="283" style="font-family: SansBold; font-size: 10px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,566) scale(1,-1)">Record each outcome for every safety or refusal task</text>
			<rect x="0" y="213" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="10" y="250" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,500) scale(1,-1)">1  Entity recognition</text>
			<text x="10" y="235" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,470) scale(1,-1)">Was the intended entity resolved?</text>
			<rect x="256" y="213" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="266" y="250" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,500) scale(1,-1)">2  Factual access</text>
			<text x="266" y="235" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,470) scale(1,-1)">Was the required fact available in the answer?</text>
			<rect x="0" y="151" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="10" y="188" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,376) scale(1,-1)">3  Refusal / abstention</text>
			<text x="10" y="173" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,346) scale(1,-1)">What was withheld, and what reason was stated?</text>
			<rect x="256" y="151" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="266" y="188" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,376) scale(1,-1)">4  Answer quality</text>
			<text x="266" y="173" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,346) scale(1,-1)">Correctness and required coverage scored separately.</text>
			<rect x="0" y="89" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="10" y="126" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,252) scale(1,-1)">5  Familiarity / novelty</text>
			<text x="10" y="111" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,222) scale(1,-1)">Define the reference set; do not infer training exposure.</text>
			<rect x="256" y="89" width="248" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(94%,96%,96%); fill-rule: evenodd;"/>
			<text x="266" y="126" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,252) scale(1,-1)">6  Feasibility</text>
			<text x="266" y="111" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,222) scale(1,-1)">Can the task be completed within declared resources?</text>
			<rect x="0" y="27" width="504" height="54" rx="4" ry="4" style="stroke: none; stroke-linecap: butt; stroke-width: 1; fill: rgb(87%,92%,90%); fill-rule: evenodd;"/>
			<text x="10" y="64" style="font-family: SansBold; font-size: 9px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,128) scale(1,-1)">7  Execution and experimental validation</text>
			<text x="10" y="49" style="font-family: Sans; font-size: 8px;fill: rgb(9%,21%,27%); stroke:none;" transform="translate(0,98) scale(1,-1)">Record all attempts, failures, analytical identity, yield, purity, repeatability, and human intervention.</text>
			<text x="0" y="9" style="font-family: Sans; font-size: 8px;fill: rgb(37%,44%,49%); stroke:none;" transform="translate(0,18) scale(1,-1)">Record these measurements separately; no internal sequence or combined score is assumed.</text>
		</g>
	</g>
</svg>
